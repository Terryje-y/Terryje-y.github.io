<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Connecting TikTok</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ff; color: #0f0a2a;
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .box { max-width: 420px; margin: 16px; padding: 28px; background: #fff; border-radius: 20px; box-shadow: 0 12px 32px -14px rgba(79,70,229,.3); text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #4a4668; margin: 0 0 16px; }
  a.btn { display: inline-block; padding: 12px 20px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 700;
          background: linear-gradient(135deg, #7c3aed, #4f46e5 50%, #2563eb); }
</style>
</head>
<body>
<div class="box">
  <h1 id="t">Connecting your TikTok account…</h1>
  <p id="m">Returning you to the News AI Engine dashboard on this device.</p>
  <a class="btn" id="go" href="#" hidden>Open the dashboard to finish</a>
</div>
<script>
// TikTok requires an https redirect address; the engine's dashboard runs locally at http://127.0.0.1:8765.
// This page only forwards TikTok's one-time login result to the dashboard on the SAME device.
// Nothing is stored, logged or sent anywhere else (no ads, analytics or third-party scripts on this page).
(function () {
  var src = new URLSearchParams(location.search), out = new URLSearchParams();
  ["code", "state", "scopes", "error", "error_description"].forEach(function (k) {
    var v = src.get(k);
    if (v !== null && v.length < 2048) out.set(k, v);
  });
  var target = "http://127.0.0.1:8765/api/tiktok/oauth/callback?" + out.toString();
  history.replaceState(null, "", location.pathname);   // remove the code from this page's address bar/history
  if (!out.get("state")) {
    document.getElementById("t").textContent = "Nothing to connect";
    document.getElementById("m").textContent = "Start the connection from TikTok Studio in your News AI Engine dashboard.";
    return;
  }
  var go = document.getElementById("go");
  go.href = target;
  go.hidden = false;
  location.replace(target);
})();
</script>
</body>
</html>
